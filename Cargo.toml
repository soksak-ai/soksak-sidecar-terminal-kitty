[package]
name = "soksak-sidecar-terminal-kitty"
version = "0.0.43"
edition = "2024"
publish = false
license = "GPL-3.0-only"
description = "Kitty terminal-state provider for the Soksak terminal recovery contract."
build = "build.rs"

[lib]
name = "soksak_sidecar_terminal_kitty"
path = "src/lib.rs"

[[bin]]
name = "soksak-sidecar-terminal-kitty"
path = "src/main.rs"

[dependencies]
soksak-kit-sidecar-terminal = { git = "https://github.com/soksak-ai/soksak-kit-sidecar-terminal", rev = "97c20b025b042f0de9798a7c57d8c38200886e7d", features = ["integration-tests"] }

[build-dependencies]
serde_json = "=1.0.150"

[dev-dependencies]
serde_json = "=1.0.150"
soksak-contract-terminal = { git = "https://github.com/soksak-ai/soksak-contract-terminal", rev = "4acb6bc296332daac35cf58c3a846c3b18748301" }

[workspace]
