[package]
name = "soksak-sidecar-terminal-kitty"
version = "0.0.13"
edition = "2024"
publish = false
license = "GPL-3.0-only"
description = "Kitty terminal-state provider for the Soksak terminal recovery contract."
build = "build.rs"

[lib]
name = "soksak_sidecar_terminal_kitty"
path = "src/lib.rs"

[[bin]]
name = "soksak-sidecar-terminal-kitty"
path = "src/main.rs"

[dependencies]
soksak-kit-sidecar-terminal = { git = "https://github.com/soksak-ai/soksak-kit-sidecar-terminal", rev = "f45e3924f1e79dc8232447342c40f5a413cab148", features = ["integration-tests"] }

[build-dependencies]
serde_json = "=1.0.150"

[dev-dependencies]
serde_json = "=1.0.150"
soksak-contract-terminal = { git = "https://github.com/soksak-ai/soksak-contract-terminal", rev = "a0421a07721338f94e7ac523a7936f6e6afd9e43" }

[workspace]
