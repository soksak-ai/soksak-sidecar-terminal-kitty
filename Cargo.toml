[package]
name = "soksak-sidecar-terminal-kitty"
version = "0.0.40"
edition = "2024"
publish = false
license = "GPL-3.0-only"
description = "Kitty terminal-state provider for the Soksak terminal recovery contract."
build = "build.rs"

[lib]
name = "soksak_sidecar_terminal_kitty"
path = "src/lib.rs"

[[bin]]
name = "soksak-sidecar-terminal-kitty"
path = "src/main.rs"

[dependencies]
soksak-kit-sidecar-terminal = { git = "https://github.com/soksak-ai/soksak-kit-sidecar-terminal", rev = "8d1ef287cfdfa9d2d09f5cba1946f33c67589163", features = ["integration-tests"] }

[build-dependencies]
serde_json = "=1.0.150"

[dev-dependencies]
serde_json = "=1.0.150"
soksak-contract-terminal = { git = "https://github.com/soksak-ai/soksak-contract-terminal", rev = "e2d60b034148fdf6b43637bba41e9a068515c0a8" }

[workspace]
