name: release
on:
  workflow_dispatch:
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: soksak-sidecars/soksak-sidecar-terminal-kitty
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { path: soksak-sidecars/soksak-sidecar-terminal-kitty }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: soksak-ai/soksak-kit-sidecar-terminal
          ref: c2fd091c5cfd5de41297a9111231b8b442cea971
          path: soksak-kits/soksak-kit-sidecar-terminal
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: soksak-ai/soksak-contract-terminal
          ref: 5185e9f43b5b7bd236beb449e3fb252d02b4732e
          path: soksak-contracts/soksak-contract-terminal
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: min-median-max/kitty
          ref: d5f52872e805aa29837dcfe55d6833ae681805d3
          path: externals/kitty
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}
      - name: Install Linux SDK requirements
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential libcanberra-dev libcairo2-dev libdbus-1-dev libfontconfig-dev \
            libgl1-mesa-dev libharfbuzz-dev liblcms2-dev libpng-dev libpython3-dev \
            libsimde-dev libsystemd-dev libwayland-dev libx11-xcb-dev libxcb-xkb-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxrandr-dev libxxhash-dev patchelf pkg-config \
            python3-dev uuid-dev wayland-protocols
      - name: Install macOS SDK requirements
        if: runner.os == 'macOS'
        run: brew install harfbuzz little-cms2 libpng openssl@3 pkgconf python simde xxhash zlib
      - name: Build Kitty SDK
        working-directory: externals/kitty
        run: python3 setup.py kitty-provider-sdk
      - name: Stage sidecar
        env:
          SOKSAK_KITTY_PROVIDER_SDK: ${{ github.workspace }}/externals/kitty/build/kitty-provider
        run: ./stage.sh dist "${{ matrix.target }}"
      - id: archive
        shell: bash
        run: |
          out="soksak-sidecar-terminal-kitty-0.0.1-${{ matrix.target }}.tar.gz"
          ./scripts/package-release.sh dist "${{ matrix.target }}" "$out"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$out" | tee "$out.sha256"; else shasum -a 256 "$out" | tee "$out.sha256"; fi
          echo "asset=$out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-${{ matrix.target }}
          path: |
            soksak-sidecars/soksak-sidecar-terminal-kitty/${{ steps.archive.outputs.asset }}
            soksak-sidecars/soksak-sidecar-terminal-kitty/${{ steps.archive.outputs.asset }}.sha256
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: soksak-sidecars/soksak-sidecar-terminal-kitty
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { path: soksak-sidecars/soksak-sidecar-terminal-kitty }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "22.12.0" }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: "10.30.3" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: dist-*
          path: soksak-sidecars/soksak-sidecar-terminal-kitty/dist
          merge-multiple: true
      - run: node scripts/build-release.mjs --commit "${{ github.sha }}" --tag v0.0.1 --artifacts dist --out dist-release
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: soksak-ai/soksak-spec
          ref: d7f54852754195527f125d1fc11362316157d19b
          path: soksak-sidecars/soksak-sidecar-terminal-kitty/.dependency/soksak-spec
      - name: Build the exact public validator without links
        working-directory: soksak-sidecars/soksak-sidecar-terminal-kitty/.dependency/soksak-spec
        run: |
          pnpm --config.node-linker=hoisted --config.symlink=false install --frozen-lockfile
          pnpm build
          test -z "$(find . -type l -print -quit)"
      - run: node scripts/validate-with-spec.mjs --spec-root .dependency/soksak-spec --release-dir dist-release
      - id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.SOKSAK_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.SOKSAK_RELEASE_PRIVATE_KEY }}
          permission-administration: read
          permission-contents: write
      - name: Publish immutable release
        env: { GH_TOKEN: "${{ steps.release-token.outputs.token }}" }
        run: |
          test "$(gh api "repos/${{ github.repository }}/immutable-releases" --jq '.enabled and .enforced_by_owner')" = true
          assets="$(find dist dist-release -type f \( -name '*.tar.gz' -o -name '*.sha256' -o -name '*.json' \) | sort)"
          test "$(printf '%s\n' "$assets" | grep -c '\.tar\.gz$')" -eq 4
          test "$(printf '%s\n' "$assets" | grep -c '\.tar\.gz\.sha256$')" -eq 4
          gh release create v0.0.1 --repo "${{ github.repository }}" --target "${{ github.sha }}" --title v0.0.1 --generate-notes $assets
